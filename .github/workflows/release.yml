name: Release

# Cut on tag push (v*): run the gauntlet, build and push the multi-arch
# manager image to GHCR, regenerate the install bundle pinned to the tag,
# and publish a GitHub release carrying it. Tools come from the runner or
# pinned actions only — no third-party release actions in the path.
on:
  push:
    tags:
      - "v*"
    branches:
      - main
      - claude/dreamy-darwin-wcepfb
    paths:
      - "release/REQUEST"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (created if absent)"
        required: true
        default: "v0.1.0"
      target:
        description: "Commit SHA to tag (defaults to the dispatched ref)"
        required: false

permissions: {}

jobs:
  release:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Resolve release request
        run: |
          TAG="${{ github.event.inputs.tag }}"; TARGET="${{ github.event.inputs.target }}"
          if [ -z "$TAG" ] && [ "${{ github.ref_type }}" = "branch" ] && [ -f release/REQUEST ]; then
            TAG=$(grep -E '^tag=' release/REQUEST | cut -d= -f2)
            TARGET=$(grep -E '^target=' release/REQUEST | cut -d= -f2)
          fi
          TAG="${TAG:-${{ github.ref_name }}}"
          TARGET="${TARGET:-${{ github.sha }}}"
          # Prevent publishing artifacts built from this checkout under a tag
          # pointing to another commit. Workflow dispatch and REQUEST cannot
          # override the source revision without a matching checkout.
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag must be a valid v-prefixed semantic version"
            exit 1
          fi
          if [ "$TARGET" != "${{ github.sha }}" ]; then
            echo "::error::Release target $TARGET differs from checked-out commit ${{ github.sha }}"
            exit 1
          fi
          { echo "TAG=$TAG"; echo "TARGET=$TARGET";
            echo "IMG=ghcr.io/${{ github.repository_owner }}/kubecontainer:$TAG"; } >> "$GITHUB_ENV"

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Gauntlet
        run: |
          make test
          make test-report
          make lint
          make vocab-check
          make eval
          make security-report
          ./hack/check-promise.sh

      # Release must prove workload convergence in a real Kubernetes control plane,
      # not only envtest/unit-level behavior. A failed gate stops publication.
      - name: Install pinned kind for release e2e gate
        env:
          KIND_VERSION: v0.32.0
        run: |
          curl -fsSLo ./kind "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-$(go env GOARCH)"
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      - name: Verify deployment, traffic, recovery, and cleanup in kind
        env:
          CERT_MANAGER_INSTALL_SKIP: "true"
        run: |
          go mod verify
          make test-e2e

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push image
        run: |
          docker build -t "$IMG" .
          docker push "$IMG"
          docker build -t "ghcr.io/${{ github.repository_owner }}/kubecontainer-site:$TAG" -f Dockerfile.site .
          docker push "ghcr.io/${{ github.repository_owner }}/kubecontainer-site:$TAG"
          docker build -t "ghcr.io/${{ github.repository_owner }}/filefabric:$TAG" -f Dockerfile.filefabric .
          docker push "ghcr.io/${{ github.repository_owner }}/filefabric:$TAG"
          docker build -t "ghcr.io/${{ github.repository_owner }}/agentregistry:$TAG" -f Dockerfile.agentregistry .
          docker push "ghcr.io/${{ github.repository_owner }}/agentregistry:$TAG"
          docker build -t "ghcr.io/${{ github.repository_owner }}/openautonomyx-site:$TAG" -f Dockerfile.autonomyx .
          docker push "ghcr.io/${{ github.repository_owner }}/openautonomyx-site:$TAG"
          docker build -t "ghcr.io/${{ github.repository_owner }}/arithmetic-platform:$TAG" -f Dockerfile.arithmetic .
          docker push "ghcr.io/${{ github.repository_owner }}/arithmetic-platform:$TAG"
          docker build -t "ghcr.io/${{ github.repository_owner }}/fabric-browser:$TAG" -f Dockerfile.fabric .
          docker push "ghcr.io/${{ github.repository_owner }}/fabric-browser:$TAG"

      - name: Capture immutable OCI digests
        run: |
          set -euo pipefail
          mkdir -p dist
          : > dist/OCI-DIGESTS
          for name in kubecontainer kubecontainer-site filefabric agentregistry openautonomyx-site arithmetic-platform fabric-browser; do
            image="ghcr.io/${{ github.repository_owner }}/${name}:$TAG"
            digest="$(docker buildx imagetools inspect "$image" | awk '/^Digest:/ { print $2; exit }')"
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Missing or malformed digest for $image"
              exit 1
            fi
            printf '%s@%s\n' "${image%:*}" "$digest" >> dist/OCI-DIGESTS
            env_key="${name^^}"
            env_key="${env_key//-/_}"
            echo "PINNED_${env_key}=${image%:*}@$digest" >> "$GITHUB_ENV"
            echo "DIGEST_${env_key}=$digest" >> "$GITHUB_ENV"
          done
          cat dist/OCI-DIGESTS
          operator_image="$(head -n 1 dist/OCI-DIGESTS)"
          echo "PINNED_IMG=$operator_image" >> "$GITHUB_ENV"
          echo "OPERATOR_DIGEST=${operator_image##*@}" >> "$GITHUB_ENV"

      - name: Build install bundle pinned to immutable image digest
        run: make build-installer IMG="$PINNED_IMG"

      - name: Generate operator image SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.PINNED_IMG }}
          format: spdx-json
          output-file: dist/kubecontainer.spdx.json
          syft-version: v1.54.0
          upload-artifact: false
          upload-release-assets: false

      - name: Attest operator image build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/kubecontainer
          subject-digest: ${{ env.OPERATOR_DIGEST }}
          push-to-registry: true

      - name: Attest operator image SPDX SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/kubecontainer
          subject-digest: ${{ env.OPERATOR_DIGEST }}
          sbom-path: dist/kubecontainer.spdx.json
          push-to-registry: true

      - name: Generate kubecontainer-site SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.PINNED_KUBECONTAINER_SITE }}
          format: spdx-json
          output-file: dist/kubecontainer-site.spdx.json
          syft-version: v1.54.0
          upload-artifact: false
          upload-release-assets: false

      - name: Attest kubecontainer-site image build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/kubecontainer-site
          subject-digest: ${{ env.DIGEST_KUBECONTAINER_SITE }}
          push-to-registry: true

      - name: Attest kubecontainer-site image SPDX SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/kubecontainer-site
          subject-digest: ${{ env.DIGEST_KUBECONTAINER_SITE }}
          sbom-path: dist/kubecontainer-site.spdx.json
          push-to-registry: true

      - name: Generate filefabric SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.PINNED_FILEFABRIC }}
          format: spdx-json
          output-file: dist/filefabric.spdx.json
          syft-version: v1.54.0
          upload-artifact: false
          upload-release-assets: false

      - name: Attest filefabric image build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/filefabric
          subject-digest: ${{ env.DIGEST_FILEFABRIC }}
          push-to-registry: true

      - name: Attest filefabric image SPDX SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/filefabric
          subject-digest: ${{ env.DIGEST_FILEFABRIC }}
          sbom-path: dist/filefabric.spdx.json
          push-to-registry: true

      - name: Generate agentregistry SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.PINNED_AGENTREGISTRY }}
          format: spdx-json
          output-file: dist/agentregistry.spdx.json
          syft-version: v1.54.0
          upload-artifact: false
          upload-release-assets: false

      - name: Attest agentregistry image build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/agentregistry
          subject-digest: ${{ env.DIGEST_AGENTREGISTRY }}
          push-to-registry: true

      - name: Attest agentregistry image SPDX SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/agentregistry
          subject-digest: ${{ env.DIGEST_AGENTREGISTRY }}
          sbom-path: dist/agentregistry.spdx.json
          push-to-registry: true

      - name: Generate openautonomyx-site SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.PINNED_OPENAUTONOMYX_SITE }}
          format: spdx-json
          output-file: dist/openautonomyx-site.spdx.json
          syft-version: v1.54.0
          upload-artifact: false
          upload-release-assets: false

      - name: Attest openautonomyx-site image build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/openautonomyx-site
          subject-digest: ${{ env.DIGEST_OPENAUTONOMYX_SITE }}
          push-to-registry: true

      - name: Attest openautonomyx-site image SPDX SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/openautonomyx-site
          subject-digest: ${{ env.DIGEST_OPENAUTONOMYX_SITE }}
          sbom-path: dist/openautonomyx-site.spdx.json
          push-to-registry: true

      - name: Generate arithmetic-platform SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.PINNED_ARITHMETIC_PLATFORM }}
          format: spdx-json
          output-file: dist/arithmetic-platform.spdx.json
          syft-version: v1.54.0
          upload-artifact: false
          upload-release-assets: false

      - name: Attest arithmetic-platform image build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/arithmetic-platform
          subject-digest: ${{ env.DIGEST_ARITHMETIC_PLATFORM }}
          push-to-registry: true

      - name: Attest arithmetic-platform image SPDX SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/arithmetic-platform
          subject-digest: ${{ env.DIGEST_ARITHMETIC_PLATFORM }}
          sbom-path: dist/arithmetic-platform.spdx.json
          push-to-registry: true

      - name: Generate fabric-browser SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.PINNED_FABRIC_BROWSER }}
          format: spdx-json
          output-file: dist/fabric-browser.spdx.json
          syft-version: v1.54.0
          upload-artifact: false
          upload-release-assets: false

      - name: Attest fabric-browser image build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/fabric-browser
          subject-digest: ${{ env.DIGEST_FABRIC_BROWSER }}
          push-to-registry: true

      - name: Attest fabric-browser image SPDX SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/fabric-browser
          subject-digest: ${{ env.DIGEST_FABRIC_BROWSER }}
          sbom-path: dist/fabric-browser.spdx.json
          push-to-registry: true

      - name: Attest install bundle provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/install.yaml

      - name: Verify release evidence before publication
        shell: bash
        run: |
          set -euo pipefail
          expected=(kubecontainer kubecontainer-site filefabric agentregistry openautonomyx-site arithmetic-platform fabric-browser)
          test "$(wc -l < dist/OCI-DIGESTS)" -eq "${#expected[@]}"
          for name in "${expected[@]}"; do
            image="ghcr.io/${{ github.repository_owner }}/$name"
            matches="$(grep -Ec "^$image@sha256:[a-f0-9]{64}$" dist/OCI-DIGESTS || true)"
            if [ "$matches" -ne 1 ]; then
              echo "::error::Expected exactly one valid OCI digest for $image"
              exit 1
            fi
            file="dist/$name.spdx.json"
            if [ ! -s "$file" ] || ! jq -e --arg n "$name" '
              .spdxVersion | startswith("SPDX-2.")
            ' "$file" >/dev/null; then
              echo "::error::Missing or invalid SPDX SBOM for $name"
              exit 1
            fi
          done
          grep -Fq "$PINNED_IMG" dist/install.yaml || {
            echo "::error::Installer is not pinned to the attested operator image digest"
            exit 1
          }
          echo "All seven image digests, SPDX SBOMs, and digest-pinned installer are present."

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          GOOS=linux GOARCH=amd64 go build -o dist/homesetup-linux-amd64 ./cmd/homesetup
          cd dist && sha256sum install.yaml eval-report.json test-report.json security-report.json homesetup-linux-amd64 OCI-DIGESTS kubecontainer.spdx.json kubecontainer-site.spdx.json filefabric.spdx.json agentregistry.spdx.json openautonomyx-site.spdx.json arithmetic-platform.spdx.json fabric-browser.spdx.json > SHA256SUMS && cd ..
          (cd dist && sha256sum --check SHA256SUMS)
          gh release create "$TAG" dist/SHA256SUMS dist/OCI-DIGESTS dist/kubecontainer.spdx.json dist/kubecontainer-site.spdx.json dist/filefabric.spdx.json dist/agentregistry.spdx.json dist/openautonomyx-site.spdx.json dist/arithmetic-platform.spdx.json dist/fabric-browser.spdx.json dist/install.yaml dist/eval-report.json dist/test-report.json dist/security-report.json dist/homesetup-linux-amd64 \
            --target "$TARGET" \
            --title "$TAG" \
            --notes "See CHANGELOG.md for this release. Install: kubectl apply -f install.yaml — image: $PINNED_IMG. The eval report is the release's evidence record."
